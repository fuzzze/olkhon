<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Фавиконка «Внутреннего Ольхона»: персонаж в профиль (смотрит вправо), по грудь, в жёлтом круге -->
  <defs>
    <clipPath id="c"><circle cx="32" cy="32" r="32"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="32" fill="#f2b10c"/>
  <g clip-path="url(#c)">
    <!-- рюкзак за спиной — тёмно-жёлтый, выступает назад -->
    <path d="M4 44 Q4 37 11 37 L21 37 L21 66 L4 66 Z" fill="#b98200"/>
    <!-- тело в профиль: прямая спина слева, грудь выпуклостью вперёд -->
    <path d="M17 66 L17 47 Q17 40 25 38 L37 38 Q47 39 50 48 Q52 56 51 66 Z" fill="#111"/>
    <!-- лямка рюкзака через плечо -->
    <path d="M19 41 Q27 37 33 41 L33 45 Q27 41.5 20 45 Z" fill="#b98200"/>
    <!-- купол шлема — чуть впереди корпуса -->
    <circle cx="34" cy="23" r="14.5" fill="#fff"/>
    <!-- тень на затылке и снизу -->
    <path d="M20.6 27.5 A14.5 14.5 0 0 0 44 33.4 A16 16 0 0 1 20.6 27.5 Z" fill="#d6d6d6"/>
    <!-- воротник шлема, наклонён вперёд -->
    <path d="M22 35.5 Q34 41 46 34 L47.5 37 Q34 45 21 38.5 Z" fill="#111"/>
  </g>
</svg>
